<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/><stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b8c"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <circle cx="1180" cy="60" r="220" fill="#7c5cff" opacity="0.08"/>
  <circle cx="120" cy="720" r="200" fill="#22d3ee" opacity="0.06"/>

  <text x="60" y="66" fill="#e7ecf6" font-size="30" font-weight="700">Ambigua — resolution pipeline</text>
  <text x="60" y="96" fill="#8b98b0" font-size="16">An ambiguous ask is resolved by the workspace context around it — or turned into one good question.</text>

  <!-- A: ambiguous ask -->
  <rect x="60" y="300" width="200" height="130" rx="16" fill="#141c2c" stroke="#7c5cff" stroke-opacity="0.55"/>
  <text x="80" y="336" fill="#c4b5fd" font-size="13" letter-spacing="1.5">INPUT</text>
  <text x="80" y="366" fill="#e7ecf6" font-size="18" font-weight="650">Ambiguous ask</text>
  <text x="80" y="396" fill="#8b98b0" font-size="13.5">“the numbers for the thing</text>
  <text x="80" y="415" fill="#8b98b0" font-size="13.5">we talked about yesterday”</text>

  <!-- B: context -->
  <rect x="330" y="286" width="230" height="158" rx="16" fill="#141c2c" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="350" y="320" fill="#7dd3fc" font-size="13" letter-spacing="1.5">CONTEXT LAYER</text>
  <text x="350" y="348" fill="#e7ecf6" font-size="17" font-weight="650">Workspace signals</text>
  <text x="350" y="378" fill="#8b98b0" font-size="14">• channels · topic domain</text>
  <text x="350" y="399" fill="#8b98b0" font-size="14">• files · “the numbers”, “the deck”</text>
  <text x="350" y="420" fill="#8b98b0" font-size="14">• messages · recency + thread</text>

  <!-- C: engine -->
  <rect x="630" y="286" width="240" height="158" rx="16" fill="#141c2c" stroke="#7c5cff" stroke-opacity="0.5"/>
  <text x="650" y="320" fill="#c4b5fd" font-size="13" letter-spacing="1.5">RANKING ENGINE</text>
  <text x="650" y="348" fill="#e7ecf6" font-size="17" font-weight="650">Score interpretations</text>
  <text x="650" y="378" fill="#8b98b0" font-size="14">• token match (synonyms)</text>
  <text x="650" y="399" fill="#8b98b0" font-size="14">• recency window (“yesterday”)</text>
  <text x="650" y="420" fill="#8b98b0" font-size="14">• channel affinity</text>

  <!-- D: gate -->
  <rect x="940" y="306" width="180" height="118" rx="16" fill="#141c2c" stroke="#8b98b0" stroke-opacity="0.5"/>
  <text x="960" y="340" fill="#e7ecf6" font-size="16" font-weight="650">Confidence</text>
  <text x="960" y="362" fill="#e7ecf6" font-size="16" font-weight="650">gate</text>
  <text x="960" y="390" fill="#8b98b0" font-size="12.5">one clear winner?</text>
  <text x="960" y="408" fill="#8b98b0" font-size="12.5">+ absolute floor</text>

  <!-- arrows main chain -->
  <line x1="260" y1="365" x2="322" y2="365" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="560" y1="365" x2="622" y2="365" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="870" y1="365" x2="932" y2="365" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- E: resolved -->
  <rect x="1150" y="150" width="210" height="130" rx="16" fill="#0f2420" stroke="#34d399" stroke-opacity="0.6"/>
  <text x="1170" y="184" fill="#6ee7b7" font-size="13" letter-spacing="1.5">YES → RESOLVED</text>
  <text x="1170" y="212" fill="#e7ecf6" font-size="16" font-weight="650">Grounded answer</text>
  <text x="1170" y="238" fill="#8b98b0" font-size="13.5">+ the sources that</text>
  <text x="1170" y="256" fill="#8b98b0" font-size="13.5">justify the choice</text>

  <!-- F: clarify -->
  <rect x="1150" y="430" width="210" height="130" rx="16" fill="#241f0f" stroke="#fbbf24" stroke-opacity="0.6"/>
  <text x="1170" y="464" fill="#fcd34d" font-size="13" letter-spacing="1.5">NO → CLARIFY</text>
  <text x="1170" y="492" fill="#e7ecf6" font-size="16" font-weight="650">One question</text>
  <text x="1170" y="518" fill="#8b98b0" font-size="13.5">+ top interpretations</text>
  <text x="1170" y="536" fill="#8b98b0" font-size="13.5">as quick-pick options</text>

  <!-- G: commit -->
  <rect x="1150" y="636" width="210" height="86" rx="16" fill="#141c2c" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="1170" y="668" fill="#7dd3fc" font-size="13" letter-spacing="1.5">USER CONFIRMS</text>
  <text x="1170" y="696" fill="#e7ecf6" font-size="16" font-weight="650">Commit to it</text>

  <!-- branches from gate -->
  <path d="M1120 340 C 1140 340, 1130 215, 1148 215" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrg)"/>
  <path d="M1120 392 C 1140 392, 1130 495, 1148 495" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arra)"/>
  <line x1="1255" y1="560" x2="1255" y2="628" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- note chip -->
  <rect x="60" y="620" width="470" height="102" rx="14" fill="#101827" stroke="#8b98b0" stroke-opacity="0.28"/>
  <text x="82" y="652" fill="#c4b5fd" font-size="13" letter-spacing="1.2">WHY IT COUNTS AS “AMBIGUOUS AI”</text>
  <text x="82" y="680" fill="#8b98b0" font-size="13.5">Every step is probabilistic and explainable: the agent shows its</text>
  <text x="82" y="700" fill="#8b98b0" font-size="13.5">rankings and evidence — and knows when it doesn’t know.</text>
  <!-- proactive scan -->
  <rect x="60" y="540" width="200" height="70" rx="14" fill="#141c2c" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="80" y="568" fill="#7dd3fc" font-size="12" letter-spacing="1.3">PROACTIVE</text>
  <text x="80" y="592" fill="#e7ecf6" font-size="14" font-weight="600">Scan channel</text>
  <line x1="160" y1="540" x2="160" y2="438" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- team memory loop -->
  <rect x="630" y="556" width="240" height="80" rx="14" fill="#0f2420" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="650" y="584" fill="#6ee7b7" font-size="12" letter-spacing="1.3">TEAM MEMORY</text>
  <text x="650" y="608" fill="#e7ecf6" font-size="14" font-weight="600">Learned vocabulary</text>
  <text x="650" y="626" fill="#8b98b0" font-size="11.5">fewer questions over time</text>
  <path d="M1150 706 C 1030 728, 920 702, 874 642" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrg)"/>
  <path d="M750 556 L750 450" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrg)"/>

  <!-- value meter -->
  <rect x="940" y="596" width="190" height="56" rx="12" fill="#141c2c" stroke="#8b98b0" stroke-opacity="0.4"/>
  <text x="960" y="620" fill="#a7f3d0" font-size="13" font-weight="700">≈ minutes saved</text>
  <text x="960" y="640" fill="#8b98b0" font-size="11.5">the ROI a manager buys</text>
</svg>
