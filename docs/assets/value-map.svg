<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e17"/><stop offset="1" stop-color="#0c1220"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b8c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <circle cx="1200" cy="70" r="200" fill="#7c5cff" opacity="0.07"/>
  <circle cx="140" cy="720" r="180" fill="#22d3ee" opacity="0.06"/>

  <text x="40" y="60" fill="#e7ecf6" font-size="30" font-weight="700">Ambigua — who it's for, and the value it unlocks</text>
  <text x="40" y="90" fill="#8b98b0" font-size="16">Ambiguity is a hidden tax on every team. Ambigua turns vague intent into correct action — using the context the team already has.</text>

  <!-- row labels -->
  <text x="24" y="204" fill="#66738c" font-size="13" font-weight="700" letter-spacing="1.5">WHO</text>
  <text x="24" y="340" fill="#66738c" font-size="13" font-weight="700" letter-spacing="1.5">PAIN</text>
  <text x="24" y="488" fill="#66738c" font-size="13" font-weight="700" letter-spacing="1.5">VALUE</text>

  <!-- ROW 1: audiences -->
  <g>
    <rect x="140" y="150" width="290" height="96" rx="14" fill="#141c2c" stroke="#7c5cff" stroke-opacity="0.5"/>
    <text x="160" y="182" fill="#c4b5fd" font-size="15" font-weight="700">Cross-functional teams</text>
    <text x="160" y="206" fill="#8b98b0" font-size="12.5">PM · growth · eng · design in one chat</text>
    <text x="160" y="228" fill="#8b98b0" font-size="12.5">10–200 people, high coordination</text>

    <rect x="460" y="150" width="290" height="96" rx="14" fill="#141c2c" stroke="#7c5cff" stroke-opacity="0.5"/>
    <text x="480" y="182" fill="#c4b5fd" font-size="15" font-weight="700">Ops, support &amp; agencies</text>
    <text x="480" y="206" fill="#8b98b0" font-size="12.5">high volume of vague inbound asks</text>
    <text x="480" y="228" fill="#8b98b0" font-size="12.5">tickets · client briefs · requests</text>

    <rect x="780" y="150" width="290" height="96" rx="14" fill="#141c2c" stroke="#7c5cff" stroke-opacity="0.5"/>
    <text x="800" y="182" fill="#c4b5fd" font-size="15" font-weight="700">Enterprise knowledge work</text>
    <text x="800" y="206" fill="#8b98b0" font-size="12.5">large orgs, heavy onboarding</text>
    <text x="800" y="228" fill="#8b98b0" font-size="12.5">compliance &amp; audit needs</text>

    <rect x="1100" y="150" width="290" height="96" rx="14" fill="#141c2c" stroke="#7c5cff" stroke-opacity="0.5"/>
    <text x="1120" y="182" fill="#c4b5fd" font-size="15" font-weight="700">Agent &amp; platform builders</text>
    <text x="1120" y="206" fill="#8b98b0" font-size="12.5">any agent that takes human input</text>
    <text x="1120" y="228" fill="#8b98b0" font-size="12.5">needs a disambiguation layer</text>
  </g>

  <!-- ROW 2: pains -->
  <g>
    <rect x="140" y="286" width="290" height="96" rx="14" fill="#241f0f" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="160" y="318" fill="#fcd34d" font-size="15" font-weight="700">Wrong work</text>
    <text x="160" y="342" fill="#8b98b0" font-size="12.5">“the numbers” = the wrong numbers</text>
    <text x="160" y="364" fill="#8b98b0" font-size="12.5">→ rework, delays, lost trust</text>

    <rect x="460" y="286" width="290" height="96" rx="14" fill="#241f0f" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="480" y="318" fill="#fcd34d" font-size="15" font-weight="700">Interruption tax</text>
    <text x="480" y="342" fill="#8b98b0" font-size="12.5">every vague ask = a ping-back</text>
    <text x="480" y="364" fill="#8b98b0" font-size="12.5">→ focus shattered all day</text>

    <rect x="780" y="286" width="290" height="96" rx="14" fill="#241f0f" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="800" y="318" fill="#fcd34d" font-size="15" font-weight="700">Context loss</text>
    <text x="800" y="342" fill="#8b98b0" font-size="12.5">new joiners don’t know “the thing”</text>
    <text x="800" y="364" fill="#8b98b0" font-size="12.5">→ slow ramp, tribal knowledge</text>

    <rect x="1100" y="286" width="290" height="96" rx="14" fill="#241f0f" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="1120" y="318" fill="#fcd34d" font-size="15" font-weight="700">Decision latency</text>
    <text x="1120" y="342" fill="#8b98b0" font-size="12.5">vague input stalls every agent</text>
    <text x="1120" y="364" fill="#8b98b0" font-size="12.5">→ nothing ships until clarified</text>
  </g>

  <!-- ROW 3: value -->
  <g>
    <rect x="140" y="422" width="290" height="118" rx="14" fill="#0f2420" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="160" y="454" fill="#6ee7b7" font-size="15" font-weight="700">Correct on the first ask</text>
    <text x="160" y="478" fill="#8b98b0" font-size="12.5">answers or asks ONE question —</text>
    <text x="160" y="498" fill="#8b98b0" font-size="12.5">no wrong starts, no guesswork</text>
    <text x="160" y="522" fill="#8b98b0" font-size="12.5">grounded in sources</text>

    <rect x="460" y="422" width="290" height="118" rx="14" fill="#0f2420" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="480" y="454" fill="#6ee7b7" font-size="15" font-weight="700">Fewer interruptions</text>
    <text x="480" y="478" fill="#8b98b0" font-size="12.5">+ institutional memory that</text>
    <text x="480" y="498" fill="#8b98b0" font-size="12.5">compounds every time the team</text>
    <text x="480" y="522" fill="#8b98b0" font-size="12.5">confirms an interpretation</text>

    <rect x="780" y="422" width="290" height="118" rx="14" fill="#0f2420" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="800" y="454" fill="#6ee7b7" font-size="15" font-weight="700">Faster decisions + trust</text>
    <text x="800" y="478" fill="#8b98b0" font-size="12.5">context carried for joiners;</text>
    <text x="800" y="498" fill="#8b98b0" font-size="12.5">an audit trail of how each ask</text>
    <text x="800" y="522" fill="#8b98b0" font-size="12.5">was interpreted</text>

    <rect x="1100" y="422" width="290" height="118" rx="14" fill="#0f2420" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="1120" y="454" fill="#6ee7b7" font-size="15" font-weight="700">A reusable layer</text>
    <text x="1120" y="478" fill="#8b98b0" font-size="12.5">drop-in disambiguation for any</text>
    <text x="1120" y="498" fill="#8b98b0" font-size="12.5">agent — chat, browser, voice,</text>
    <text x="1120" y="522" fill="#8b98b0" font-size="12.5">even robots</text>
  </g>

  <!-- arrows -->
  <g stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#a)" fill="none">
    <line x1="285" y1="246" x2="285" y2="282"/><line x1="605" y1="246" x2="605" y2="282"/>
    <line x1="925" y1="246" x2="925" y2="282"/><line x1="1245" y1="246" x2="1245" y2="282"/>
    <line x1="285" y1="382" x2="285" y2="418"/><line x1="605" y1="382" x2="605" y2="418"/>
    <line x1="925" y1="382" x2="925" y2="418"/><line x1="1245" y1="382" x2="1245" y2="418"/>
  </g>

  <!-- outcome bar -->
  <rect x="140" y="600" width="1250" height="106" rx="16" fill="#101827" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="168" y="634" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="1.2">UNLOCKED VALUE (MEASURABLE)</text>
  <text x="168" y="664" fill="#e7ecf6" font-size="16">Hours saved · rework avoided · faster throughput · onboarding in days, not weeks</text>
  <text x="168" y="690" fill="#8b98b0" font-size="13">The value meter turns all of this into one number a manager can approve budget against.</text>
</svg>
